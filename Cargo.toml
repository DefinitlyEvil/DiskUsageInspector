[package]
name = "disk-usage-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Read-only disk usage inspector for Windows"

[dependencies]
eframe = "0.37"
egui = "0.37"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
