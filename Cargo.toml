[package]
name = "disk-usage-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Read-only disk usage inspector for Windows"
license = "Apache-2.0"
repository = "https://github.com/DefinitlyEvil/DiskUsageInspector"
keywords = ["disk-usage", "windows", "gui", "eframe", "read-only"]
categories = ["command-line-utilities", "gui"]

[dependencies]
eframe = "0.37"
egui = "0.37"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
